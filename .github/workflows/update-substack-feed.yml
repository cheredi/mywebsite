name: Update Substack Feed

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch latest Substack posts
        run: npm run fetch:substack

      - name: Commit and push if data changed
        run: |
          if ! git diff --quiet -- data/substack-posts.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/substack-posts.json
            git commit -m "chore: refresh Substack posts"
            git push
          else
            echo "No changes to Substack feed data."
          fi
